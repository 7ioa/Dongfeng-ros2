<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>东风实训小车 · 照片重建</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:#eef1f0;color:#263e42}header{padding:18px 26px;background:#f8faf9;border-bottom:1px solid #d5dddb;display:flex;align-items:center;justify-content:space-between}h1{margin:4px 0;font-size:23px;font-weight:600}.eyebrow{font-size:11px;letter-spacing:2px;color:#607c7c}.sub{font-size:12px;color:#607574}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:12px 26px;background:#fafcfb;border-bottom:1px solid #d5dddb}button{font:inherit;font-size:13px;background:#fff;color:#35595c;border:1px solid #c4d2cf;border-radius:5px;padding:8px 14px;cursor:pointer}button.active{background:#225559;color:white}label{font-size:12px;margin-left:10px}input{accent-color:#168b8f}#viewport{height:calc(100vh - 190px);min-height:500px;position:relative;touch-action:none}canvas{display:block;width:100%;height:100%}.hint{position:absolute;left:24px;bottom:16px;font-size:12px;background:#f8fbfae8;padding:9px 12px;border-radius:5px;color:#526e6c}.info{position:absolute;right:24px;top:20px;font-size:12px;line-height:1.9;background:#f8fbfaed;padding:14px 18px;border-left:3px solid #258b90;max-width:235px;pointer-events:none}.info strong{color:#254c50}footer{padding:12px 26px;font-size:12px;line-height:1.8;color:#657c78;border-top:1px solid #d5dddb} @media(max-width:700px){header{padding:15px}.sub{max-width:150px}h1{font-size:18px}.toolbar{padding:10px;gap:6px}.info{right:12px;max-width:180px;padding:9px;font-size:11px}#viewport{height:70vh}}
</style></head><body>
<header><div><div class="eyebrow">DONGFENG · TRAINING VEHICLE</div><h1>实训小车 · 照片重建模型</h1></div><div class="sub">车身长度约 20 cm<br>其余尺寸依照片比例估计</div></header>
<div class="toolbar"><button data-view="iso" class="active">整体</button><button data-view="front">车头 / 摄像头</button><button data-view="side">侧面 / 四轮</button><button data-view="rear">车尾 / 充电口</button><button data-view="top">俯视 / 镂空板</button><label><input id="sensors" type="checkbox" checked>传感器位置</label><label><input id="wire" type="checkbox">网格线</label></div>
<div id="viewport"><div class="info"><strong>结构与方向</strong><br>+X：车头方向<br>前面板中央：摄像头<br>前部平台：圆柱雷达<br>四轮底盘 · 双层镂空结构<br>灰色球体为外观标记<br><br>本阶段包含外形和安装坐标，<br>尚未生成图像或激光数据。</div><div class="hint">左键旋转 · 滚轮缩放 · 右键平移</div></div>
<footer>按提供的五张照片近似建模；四轮差速运动沿用现有控制接口。此页面只展示小车，不修改沙盘地图。</footer>
<script id="vehicle-data" type="application/json">__VEHICLE_DATA__</script><script type="module">
__THREE_LIBRARY__
const data=JSON.parse(document.getElementById('vehicle-data').textContent),viewport=document.getElementById('viewport');
const renderer=new WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xe7ecea);renderer.outputColorSpace=SRGBColorSpace;renderer.toneMapping=ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;renderer.shadowMap.enabled=true;renderer.shadowMap.type=PCFSoftShadowMap;viewport.prepend(renderer.domElement);
const scene=new Scene(),camera=new PerspectiveCamera(36,1,.001,20);camera.up.set(0,0,1);
scene.add(new HemisphereLight(0xf1f8ff,0x858d85,3));scene.add(new AmbientLight(0xffffff,.5));
const sun=new DirectionalLight(0xfff7eb,3.5);sun.position.set(.3,-.4,.65);sun.target.position.set(0,0,.02);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-.22,right:.22,top:.22,bottom:-.22,near:.02,far:1.6});sun.shadow.bias=-.00015;sun.shadow.normalBias=.0002;scene.add(sun,sun.target);
const fill=new DirectionalLight(0xd9f4ff,2.0);fill.position.set(-.35,.4,.3);scene.add(fill);
const vehicle=new Group();scene.add(vehicle);
function decode(text,Type){const str=atob(text),bytes=new Uint8Array(str.length);for(let i=0;i<str.length;i++)bytes[i]=str.charCodeAt(i);return new Type(bytes.buffer);}
for(const m of data.meshes){const g=new BufferGeometry();g.setAttribute('position',new BufferAttribute(decode(m.p,Float32Array),3));g.setAttribute('normal',new BufferAttribute(decode(m.n,Float32Array),3));g.setIndex(new BufferAttribute(decode(m.i,Uint32Array),1));const mat=new MeshStandardMaterial({color:m.color,metalness:m.metalness,roughness:m.material==='teal'?.23:m.material==='lens'?.18:m.material==='rubber'?.94:.58});const mesh=new Mesh(g,mat);mesh.name=m.name;mesh.castShadow=true;mesh.receiveShadow=true;vehicle.add(mesh);}
const plane=new Mesh(new PlaneGeometry(20,20),new MeshStandardMaterial({color:0xe2e7e4,roughness:.98}));plane.position.z=-data.wheel_radius-.0001;plane.receiveShadow=true;scene.add(plane);
const labels=new Group();scene.add(labels);
function label(text,point,offset){const canvas=document.createElement('canvas');canvas.width=512;canvas.height=80;const ctx=canvas.getContext('2d');ctx.font='500 30px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillStyle='#164d52';ctx.fillText(text,256,49);const texture=new CanvasTexture(canvas);texture.colorSpace=SRGBColorSpace;const sprite=new Sprite(new SpriteMaterial({map:texture,depthTest:false}));const anchor=new Vector3(...point),end=anchor.clone().add(new Vector3(...offset));sprite.position.copy(end);sprite.scale.set(.090,.014,1);labels.add(sprite);labels.add(new Line(new BufferGeometry().setFromPoints([anchor,end]),new LineBasicMaterial({color:0x278b90,depthTest:false})));}
label('前向摄像头',data.sensors.camera,[.036,-.060,.006]);label('前置雷达',data.sensors.lidar,[.040,.060,.025]);
const arrow=new ArrowHelper(new Vector3(1,0,0),new Vector3(.12,0,-.0275),.045,0x23888d,.012,.006);labels.add(arrow);
let target=new Vector3(0,0,.028),radius=.48,azimuth=-.72,elevation=.54;
function render(){renderer.render(scene,camera);}
function positionCamera(){camera.position.set(target.x+radius*Math.cos(elevation)*Math.cos(azimuth),target.y+radius*Math.cos(elevation)*Math.sin(azimuth),target.z+radius*Math.sin(elevation));camera.lookAt(target);}
function setView(name){target.set(0,0,.03);radius=.48;azimuth=-.72;elevation=.54;if(name==='front'){azimuth=0;elevation=.13;radius=.40;}if(name==='side'){azimuth=-Math.PI/2;elevation=.06;radius=.43;}if(name==='rear'){azimuth=Math.PI;elevation=.16;radius=.40;}if(name==='top'){azimuth=-Math.PI/2;elevation=Math.PI/2-.0001;radius=.44;target.z=.02;}positionCamera();render();for(const b of document.querySelectorAll('[data-view]'))b.classList.toggle('active',b.dataset.view===name);}
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();positionCamera();render();}
new ResizeObserver(resize).observe(viewport);for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>setView(b.dataset.view);
document.getElementById('sensors').onchange=e=>{labels.visible=e.target.checked;render();};document.getElementById('wire').onchange=e=>{for(const mesh of vehicle.children)mesh.material.wireframe=e.target.checked;render();};
let drag=null;const canvas=renderer.domElement;canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(drag.pan){const f=radius*.00075;target.x+=f*(Math.sin(azimuth)*dx+Math.cos(azimuth)*dy);target.y+=f*(-Math.cos(azimuth)*dx+Math.sin(azimuth)*dy);}else{azimuth-=dx*.006;elevation=Math.max(.025,Math.min(1.57,elevation+dy*.004));}positionCamera();render();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(.18,Math.min(1.2,radius*Math.exp(e.deltaY*.001)));positionCamera();render();},{passive:false});
window.vehicleInspect=(name,annotations=false)=>{labels.visible=annotations;setView(name);return {triangles:renderer.info.render.triangles,meshes:vehicle.children.length};};
resize();setView('iso');document.documentElement.dataset.ready='true';
</script></body></html>
